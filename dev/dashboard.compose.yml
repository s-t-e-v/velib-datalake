services:
  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      VELIB_GRAFANA_DB_HOST: "${VELIB_GRAFANA_DB_HOST:-host.docker.internal}"
      VELIB_GRAFANA_DB_PORT: "${VELIB_GRAFANA_DB_PORT:-5432}"
      VELIB_GRAFANA_DB_NAME: "${VELIB_GRAFANA_DB_NAME:-velib}"
      VELIB_GRAFANA_DB_USER: "${VELIB_GRAFANA_DB_USER:-velib}"
      VELIB_GRAFANA_DB_PASSWORD: "${VELIB_GRAFANA_DB_PASSWORD:-velib}"
      VELIB_GRAFANA_DB_SSL_MODE: "${VELIB_GRAFANA_DB_SSL_MODE:-disable}"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  grafana-data:
