services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: velib
      POSTGRES_USER: velib
      POSTGRES_PASSWORD: velib
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - velib-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velib -d velib"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  velib-postgres:

