[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "velib-datalake"
version = "0.1.0"
description = "A focused Velib availability collection and processing slice"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "azure-functions>=1.21,<2",
  "azure-identity>=1.19,<2",
  "azure-storage-blob>=12.24,<13",
  "psycopg[binary]>=3.2,<4",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
velib = "velib_datalake.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/velib_datalake"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "velib_datalake/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires TEST_DATABASE_URL pointing to PostgreSQL"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

